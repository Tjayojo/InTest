# Dependabot version-update configuration.
#
# Two ecosystems only — the two this repository actually has:
#   - `nuget`: Directory.Packages.props (central package management, no packages.lock.json).
#   - `github-actions`: the SHA-pinned actions in .github/workflows/build-and-test.yml.
#
# What this file does NOT cover, on purpose: `global.json` pins the .NET SDK at 10.0.400
# ([pin-the-sdk], docs/superpowers/plans/2026-08-22-intest-ci.md). Dependabot has no
# `dotnet-sdk`/`global.json` ecosystem (checked against GitHub's supported-ecosystems list,
# 2026-08-23 — `nuget` updates PackageReference/PackageVersion entries, not the SDK pin). A
# runner-image SDK bump is exactly what `global.json` exists to prevent from happening silently
# (Directory.Build.props sets TreatWarningsAsErrors=true and LangVersion=latest — see
# `[pin-the-sdk]`), so bumping it must stay a deliberate, reviewed edit by a human, not something
# a bot can propose here. See CONTRIBUTING.md's "Automated dependency updates" section for the
# full accounting of what this file can and cannot enforce against the dependency policy.
#
# Confirmed before writing this file, not assumed:
#   - CPM support: dependabot-core's nuget updater reads Directory.Packages.props directly
#     (confirmed via GitHub's own supported-ecosystems documentation and multiple dependabot-core
#     issues that presuppose CPM support while reporting narrower edge cases — multiple
#     Directory.Packages.props files in one repo, and packages.lock.json reconciliation under CPM
#     — neither of which applies here: this repo has exactly one Directory.Packages.props and no
#     packages.lock.json anywhere, confirmed by `git ls-files | grep -i packages.lock` returning
#     nothing).
#   - SHA-pin support: GitHub's own changelog ("Dependabot now supports pinned actions that use a
#     full-length commit SHA", 2022-08-09) and ("Dependabot now updates comments in GitHub Actions
#     workflows referencing action versions", 2022-10-31) confirm Dependabot keeps a SHA-pinned
#     action pinned to a SHA — it does not rewrite the pin to a mutable tag — and rewrites the
#     trailing `# vX.Y.Z` comment to match the new SHA's release. This is exactly the shape
#     build-and-test.yml already uses, so [pin-actions-by-sha] (same plan) is not silently
#     undone by turning this ecosystem on.
#   - What was NOT independently confirmed: whether Dependabot's nuget updater withholds
#     prerelease/preview versions by default unless a package is already pinned to one. This is
#     commonly described as Dependabot's general behaviour, but no direct GitHub-docs quote
#     confirming it for the `nuget` ecosystem specifically was found in the research for this
#     change. Every package pinned today in Directory.Packages.props is a stable release, so this
#     is currently moot in practice — but it is not something this config can be relied on to
#     enforce, and CONTRIBUTING.md says so explicitly. See its "Automated dependency updates"
#     section.

version: 2

updates:
  # -------------------------------------------------------------------------------------------
  # NuGet: Directory.Packages.props at the repo root is the single source of every package
  # version (CLAUDE.md, "Build configuration"). `directory: "/"` is where Dependabot looks for
  # it; CPM means there is exactly one file to scan rather than one per .csproj.
  # -------------------------------------------------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      # Weekly, not daily: this repository's own commit log (`git log --oneline`) shows a small
      # number of maintainers and no history of multiple merges per day. A daily schedule on a
      # low-traffic repo just produces stale, re-triggered PRs sitting for most of the week
      # ([open-pull-requests-limit] below is the second half of that same restraint). Monday is
      # arbitrary but deliberate: it puts a fresh batch at the start of a work week rather than
      # right before a weekend.
      interval: "weekly"
      day: "monday"
    # Five, not the default five-is-implicit-cap-anyway choice made carelessly: with grouping
    # (below) collapsing the mstest (3), openapi-net (2), dotnet-servicing (8) and nswag (2)
    # packages down to one PR apiece, this repo's Directory.Packages.props has 22 entries but only
    # 22 - (3-1) - (2-1) - (8-1) - (2-1) = 11 independently-updatable PR slots. A cap of 5 means at
    # most 5 concurrent open version-update PRs before Dependabot pauses opening more until one is
    # closed — enough headroom that a normal week's worth of upstream releases isn't silently
    # dropped, without opening "twenty PRs a week on a repo with one maintainer" (the failure mode
    # this task named explicitly). Security-update PRs are exempt from this cap by Dependabot's own
    # design and are not throttled by it.
    open-pull-requests-limit: 5
    # "chore:" already appears in this repo's history for dependency-adjacent maintenance
    # (`5fccdb4 chore: ownership transfer cleanup ... package metadata`,
    # `546904b chore: solution skeleton with pinned dependencies`) — reusing it here follows the
    # existing convention rather than introducing a new prefix this log has never used.
    commit-message:
      prefix: "chore"
    groups:
      # MSTest.TestFramework, MSTest.TestAdapter and MSTest.Analyzers ship from the same upstream
      # release train and move together — grouping by the `MSTest.*` name pattern is what makes
      # that true mechanically, not a hand-maintained list that can drift from it. Without this,
      # a single upstream MSTest release becomes three separate PRs, each failing
      # PackageVersionCouplingTests.InitCommandScaffoldVersionsMatchTheCenter for the same reason.
      # Grouped, it is one failing PR instead of three — see CONTRIBUTING.md's "Automated
      # dependency updates" section for what a maintainer does with it.
      #
      # Deliberately NOT extended to Microsoft.NET.Test.Sdk or Shouldly, even though both are
      # also covered by PackageVersionCouplingTests (Microsoft.NET.Test.Sdk in the three-way
      # check; Shouldly in the two-way check): "coupled by this repo's guard" and "released
      # together upstream" are different facts, and only the second is a real reason to group.
      # Microsoft.NET.Test.Sdk ships from the vstest team's own repository on its own cadence, and
      # Shouldly is an unrelated project entirely — folding either into this group would be
      # asserting an upstream release relationship that was never checked, exactly the kind of
      # unverified assumption CONTRIBUTING.md's "Ask the thing that decides" asks this project not
      # to make. They stay as individual PRs, each still hitting the same guard on its own.
      mstest:
        patterns:
          - "MSTest.*"

      # Microsoft.OpenApi and Microsoft.OpenApi.YamlReader ship from the same upstream repository
      # and move together — confirmed, not assumed, by pulling both packages' .nuspec metadata
      # from the local NuGet cache: both list <repository url="https://github.com/Microsoft/
      # OpenAPI.NET" ...>, and `curl https://api.nuget.org/v3-flatcontainer/<id>/index.json`
      # against both ids returns byte-identical version lists back to 2.0.0 — most tellingly, both
      # skip 3.10.1 identically (3.9.0 -> 3.10.0 -> 3.10.2 for each), which a shared prefix alone
      # could never explain.
      #
      # A single `Microsoft.OpenApi*` glob covers both members and nothing else in
      # Directory.Packages.props: no other PackageVersion entry starts with "Microsoft.OpenApi"
      # (Microsoft.AspNetCore.OpenApi does not — the shared text is "OpenApi", not a shared
      # prefix). This relies on a trailing `*` matching zero characters, so the bare
      # "Microsoft.OpenApi" is caught along with "Microsoft.OpenApi.YamlReader". Confirmed by
      # reading dependabot-core's own matcher, not assumed from GitHub's docs (which say only that
      # "`*` can be used as a wild card", without saying whether it can match nothing):
      # `common/lib/wildcard_matcher.rb` in github.com/dependabot/dependabot-core builds
      # `/^...$/` by `Regexp.quote`-ing the text around every `*` and joining the pieces with
      # `.*` (which matches an empty string), and its own spec
      # (`common/spec/dependabot/wildcard_matcher_spec.rb`, "when the wildcard is at the end")
      # asserts exactly this case: wildcard "bus*" against candidate "bus" — the wildcard
      # contributing nothing — is expected to be `true`.
      openapi-net:
        patterns:
          - "Microsoft.OpenApi*"

      # These eight packages are Microsoft.Extensions.Http, Microsoft.Extensions.Configuration,
      # Microsoft.Extensions.Configuration.Json, Microsoft.Extensions.Configuration.
      # EnvironmentVariables, Microsoft.AspNetCore.OpenApi, Microsoft.Extensions.
      # ApiDescription.Server, Microsoft.EntityFrameworkCore.Sqlite and Microsoft.AspNetCore.
      # Authentication.JwtBearer. Confirmed, not assumed, by pulling every one of their .nuspec
      # files from the local NuGet cache: all eight declare <repository url="https://github.com/
      # dotnet/dotnet" commit="e2f47b0110ed922f21a1522da67279133ce28f32" .../> — the *same* commit
      # in .NET's unified "VMR" monorepo, not merely the same repository. `curl
      # https://api.nuget.org/v3-flatcontainer/<id>/index.json` against all eight confirms the
      # version lists are identical at every one of the last twelve monthly releases (10.0.0
      # through 10.0.11) — this is .NET's coordinated monthly servicing train, and it always bumps
      # every one of these together to the same version number.
      #
      # Three globs — `Microsoft.Extensions.*`, `Microsoft.AspNetCore.*` and
      # `Microsoft.EntityFrameworkCore.*` — cover exactly these eight and nothing else in
      # Directory.Packages.props today: checked mechanically against every PackageVersion entry
      # in the file, the three prefixes match 5 + 2 + 1 = 8 packages with no overlap between the
      # prefixes and no thirteenth match, i.e. exactly this group's membership. System.CommandLine
      # was checked and deliberately still excluded: its .nuspec points at the identical
      # dotnet/dotnet commit as this group, but its own version (2.0.11) does not move in lockstep
      # with these packages' 10.0.x numbering — its stable releases follow their own independent
      # 2.x line (next is 3.0.0-preview.*, not 10.0.x). Same build infrastructure is not the same
      # claim as moving together, and here it also does not start with any of the three prefixes,
      # so the exclusion is enforced by construction rather than by memory.
      #
      # The accepted trade, written down as this task requires: `Microsoft.Extensions.*` is wider
      # than the five packages it happens to match today. Microsoft.Extensions.AI and
      # Microsoft.Extensions.Http.Resilience both start with "Microsoft.Extensions." and were
      # checked the same way as the group members above — their nuget.org version lists (10.9.0 at
      # last check) show they release on their own cadence, unrelated to this train's 10.0.x
      # numbering. Neither is in Directory.Packages.props today, so this is a *future* risk, not a
      # live one: the explicit list this group used to have did not have this exposure, and this
      # glob form trades that safety for brevity, deliberately, on the owner's instruction. If a
      # `Microsoft.Extensions.*` package is ever added to Directory.Packages.props, check — the
      # same way this comment did, via the package's .nuspec `<repository>` and its nuget.org
      # version history — whether it actually ships from the dotnet/dotnet VMR commit before
      # assuming this group still covers only its intended members; if it does not, move this
      # group back to an explicit list rather than adding `exclude-patterns` (this file avoids
      # exclude-patterns on purpose — inclusion fails safe, an unmatched package just gets its own
      # PR, while exclusion fails unsafe, a new package silently joins unless someone remembers to
      # list it) or letting a genuinely-independent package's updates get silently delayed behind
      # this servicing train.
      dotnet-servicing:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"

      # NSwag.AspNetCore and NSwag.MSBuild both declare <repository url="https://github.com/
      # RicoSuter/NSwag.git" .../> in their .nuspec, and their nuget.org version lists are
      # identical across the last fifteen releases (14.0.5 through 14.7.1) — confirmed the same
      # way as the other two groups above, not assumed from the matching version number already
      # in Directory.Packages.props today.
      #
      # `NSwag.*` covers both and nothing else. NJsonSchema is deliberately NOT swept in despite
      # sharing an author (RSuter) with NSwag and being an NSwag dependency: its .nuspec points at
      # a different repository (github.com/RicoSuter/NJsonSchema, not NSwag.git) and its version
      # (11.6.1) is on a completely different, independently-numbered line from NSwag's (14.7.1) —
      # same author is not the same release train — and, the fact that now matters mechanically,
      # its package id does not start with "NSwag." at all, so the glob cannot catch it regardless
      # of how its version happens to move.
      nswag:
        patterns:
          - "NSwag.*"

  # -------------------------------------------------------------------------------------------
  # GitHub Actions: every action build-and-test.yml uses is pinned by commit SHA with a trailing
  # `# vX.Y.Z` comment, per [pin-actions-by-sha] (docs/superpowers/plans/2026-08-22-intest-ci.md).
  # `directory: "/"` scans .github/workflows/ for `uses:` lines; there is only one workflow file
  # today (build-and-test.yml) and all three actions it uses (actions/checkout, actions/setup-
  # dotnet, actions/cache) are already SHA-pinned, so there is nothing here for Dependabot to
  # convert away from a tag — see the file header above for how the SHA-pin/comment-update
  # behaviour was confirmed.
  # -------------------------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Three actions total, all independent (no coupling guard, no shared upstream release train
    # the way MSTest.* has) — a cap of 5 is already more headroom than the ecosystem can use.
    open-pull-requests-limit: 5
    # "ci:" is this repo's existing prefix for changes to build-and-test.yml itself
    # (`7841bf3 ci: build-and-test workflow ...`, `b508853 ci: dogfood workflow ...`,
    # `2535805 ci: pin SDK at 10.0.400 ...`) — a Dependabot action bump is exactly that kind of
    # change, so it keeps the same prefix rather than introducing "chore:" here too.
    commit-message:
      prefix: "ci"
